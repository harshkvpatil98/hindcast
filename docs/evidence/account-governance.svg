<svg xmlns="http://www.w3.org/2000/svg" width="787" height="431" viewBox="0 0 787 431" role="img" aria-label="Account governance - CloudTrail, budget, anomaly detection, Bedrock">
<rect width="787" height="431" rx="10" fill="#0d1117"/>
<rect width="787" height="34" rx="10" fill="#161b22"/>
<rect y="24" width="787" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="5.5" fill="#ff5f56"/><circle cx="38" cy="17" r="5.5" fill="#ffbd2e"/><circle cx="56" cy="17" r="5.5" fill="#27c93f"/>
<text x="393.5" y="22" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5">Account governance - CloudTrail, budget, anomaly detection, Bedrock</text>
<g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">
<text x="18" y="56" xml:space="preserve" style="white-space:pre"><tspan fill="#8b949e"># Made in the account before Terraform, read here, and left exactly as they were.</tspan></text>
<text x="18" y="75" xml:space="preserve" style="white-space:pre"></text>
<text x="18" y="94" xml:space="preserve" style="white-space:pre"><tspan fill="#79c0ff">$ aws cloudtrail describe-trails | get-trail-status</tspan></text>
<text x="18" y="113" xml:space="preserve" style="white-space:pre">  cascade-audit-trail        multi-region: true, logging: <tspan fill="#3fb950">true</tspan></text>
<text x="18" y="132" xml:space="preserve" style="white-space:pre"><tspan fill="#79c0ff">$ aws budgets describe-budgets</tspan></text>
<text x="18" y="151" xml:space="preserve" style="white-space:pre">  cascade budget             $10 monthly</text>
<text x="18" y="170" xml:space="preserve" style="white-space:pre"><tspan fill="#79c0ff">$ aws ce get-anomaly-monitors</tspan></text>
<text x="18" y="189" xml:space="preserve" style="white-space:pre">  Default-Services-Monitor   dimensional, by service</text>
<text x="18" y="208" xml:space="preserve" style="white-space:pre"><tspan fill="#79c0ff">$ aws bedrock get-guardrail --guardrail-version 1</tspan></text>
<text x="18" y="227" xml:space="preserve" style="white-space:pre">  cascade-audit-guardrail    version 1, <tspan fill="#3fb950">READY</tspan></text>
<text x="18" y="246" xml:space="preserve" style="white-space:pre">                             filters: HATE, INSULTS, MISCONDUCT, PROMPT_ATTACK, SEXUAL, VIOLENCE</text>
<text x="18" y="265" xml:space="preserve" style="white-space:pre"><tspan fill="#79c0ff">$ aws bedrock get-foundation-model --model-identifier amazon.rerank-v1:0</tspan></text>
<text x="18" y="284" xml:space="preserve" style="white-space:pre">  Rerank 1.0                 <tspan fill="#3fb950">ACTIVE</tspan> in us-west-2</text>
<text x="18" y="303" xml:space="preserve" style="white-space:pre"></text>
<text x="18" y="322" xml:space="preserve" style="white-space:pre"><tspan fill="#79c0ff">$ cascade aws check</tspan>       <tspan fill="#8b949e"># three control-plane reads; invokes nothing, spends nothing</tspan></text>
<text x="18" y="341" xml:space="preserve" style="white-space:pre"><tspan fill="#3fb950">OK</tspan>  region      us-west-2</text>
<text x="18" y="360" xml:space="preserve" style="white-space:pre"><tspan fill="#3fb950">OK</tspan>  identity    account &lt;account-id&gt;, principal user/cascade-admin</text>
<text x="18" y="379" xml:space="preserve" style="white-space:pre"><tspan fill="#3fb950">OK</tspan>  guardrail   cascade-audit-guardrail, version 1, status READY</text>
<text x="18" y="398" xml:space="preserve" style="white-space:pre"><tspan fill="#3fb950">OK</tspan>  rerank      local reranker active; Bedrock Rerank is the opt-in overlay</text>
</g></svg>
