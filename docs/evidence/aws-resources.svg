<svg xmlns="http://www.w3.org/2000/svg" width="779" height="640" viewBox="0 0 779 640" role="img" aria-label="The deployed lake - S3, KMS, Glue, Athena, IAM, SNS (us-west-2)">
<rect width="779" height="640" rx="10" fill="#0d1117"/>
<rect width="779" height="34" rx="10" fill="#161b22"/>
<rect y="24" width="779" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="5.5" fill="#ff5f56"/><circle cx="38" cy="17" r="5.5" fill="#ffbd2e"/><circle cx="56" cy="17" r="5.5" fill="#27c93f"/>
<text x="389.5" y="22" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5">The deployed lake - S3, KMS, Glue, Athena, IAM, SNS (us-west-2)</text>
<g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">
<text x="18" y="56" xml:space="preserve" style="white-space:pre"><tspan fill="#79c0ff">$ aws s3api get-bucket-encryption | get-public-access-block | get-bucket-versioning</tspan></text>
<text x="18" y="75" xml:space="preserve" style="white-space:pre"><tspan fill="#f0f6fc">cascade-events-&lt;account-id&gt;-us-west-2</tspan></text>
<text x="18" y="94" xml:space="preserve" style="white-space:pre">  encryption        aws:kms, customer managed key, bucket key on</text>
<text x="18" y="113" xml:space="preserve" style="white-space:pre">  public access     <tspan fill="#3fb950">blocked</tspan> (all four settings)</text>
<text x="18" y="132" xml:space="preserve" style="white-space:pre">  versioning        Enabled</text>
<text x="18" y="151" xml:space="preserve" style="white-space:pre">  object lock       none (portfolio profile)</text>
<text x="18" y="170" xml:space="preserve" style="white-space:pre">  objects           events/config_id=SMOKE/smoke-b129c6125ef39d6a.parquet, 4,384 bytes, aws:kms</text>
<text x="18" y="189" xml:space="preserve" style="white-space:pre">                    2 versions kept, 0 delete markers</text>
<text x="18" y="208" xml:space="preserve" style="white-space:pre"><tspan fill="#f0f6fc">cascade-athena-results-&lt;account-id&gt;-us-west-2</tspan></text>
<text x="18" y="227" xml:space="preserve" style="white-space:pre">  encryption        aws:kms, customer managed key, bucket key on</text>
<text x="18" y="246" xml:space="preserve" style="white-space:pre">  public access     <tspan fill="#3fb950">blocked</tspan> (all four settings)</text>
<text x="18" y="265" xml:space="preserve" style="white-space:pre">  versioning        not versioned</text>
<text x="18" y="284" xml:space="preserve" style="white-space:pre">  object lock       none (portfolio profile)</text>
<text x="18" y="303" xml:space="preserve" style="white-space:pre"></text>
<text x="18" y="322" xml:space="preserve" style="white-space:pre"><tspan fill="#79c0ff">$ aws kms describe-key | get-key-rotation-status</tspan></text>
<text x="18" y="341" xml:space="preserve" style="white-space:pre">  platform key      Enabled, SYMMETRIC_DEFAULT, customer managed, rotation on</text>
<text x="18" y="360" xml:space="preserve" style="white-space:pre"></text>
<text x="18" y="379" xml:space="preserve" style="white-space:pre"><tspan fill="#79c0ff">$ aws glue get-table --database-name cascade --name events</tspan></text>
<text x="18" y="398" xml:space="preserve" style="white-space:pre">  table             cascade.events, EXTERNAL_TABLE, Parquet, 13 columns</text>
<text x="18" y="417" xml:space="preserve" style="white-space:pre">  partition key     config_id   registered: SMOKE</text>
<text x="18" y="436" xml:space="preserve" style="white-space:pre">  location          s3://cascade-events-&lt;account-id&gt;-us-west-2/events/</text>
<text x="18" y="455" xml:space="preserve" style="white-space:pre"></text>
<text x="18" y="474" xml:space="preserve" style="white-space:pre"><tspan fill="#79c0ff">$ aws athena get-work-group --work-group cascade</tspan></text>
<text x="18" y="493" xml:space="preserve" style="white-space:pre">  state             ENABLED, settings enforced: true</text>
<text x="18" y="512" xml:space="preserve" style="white-space:pre">  scan limit        10 GiB per query</text>
<text x="18" y="531" xml:space="preserve" style="white-space:pre">  results           SSE_KMS</text>
<text x="18" y="550" xml:space="preserve" style="white-space:pre"></text>
<text x="18" y="569" xml:space="preserve" style="white-space:pre"><tspan fill="#79c0ff">$ aws iam get-role | aws sns get-topic-attributes</tspan></text>
<text x="18" y="588" xml:space="preserve" style="white-space:pre">  roles             cascade-lake-writer, cascade-lake-analyst</text>
<text x="18" y="607" xml:space="preserve" style="white-space:pre">  alerts topic      cascade-cost-alerts, encrypted with the platform key</text>
</g></svg>
